<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141c">
  <title>d8sleep</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body><main>
<header><h1>Bed temperature</h1><span id="connection" class="connection" role="status">Connecting</span></header>
<div class="stage">
<div class="tabs"><button id="tab-status" class="tab" aria-expanded="false" aria-controls="drawer-status">‹ Pod status</button><button id="tab-session" class="tab" aria-expanded="false" aria-controls="drawer-session">Session ›</button></div>
<section id="control" class="card" aria-label="Bed temperature controls">
<div class="card-top"><h2 id="pod-name">Pod</h2><button id="power" class="power" aria-pressed="false">Power</button></div>
<div id="sides" class="sides" aria-label="Bed side"></div>
<div class="readout" id="target-circle"><strong id="value">—</strong><span id="estimate" class="estimate" aria-label="Estimated target temperature">—</span></div>
<label for="slider" class="sr-only">Target heating level</label><div class="slider-wrap"><input id="slider" type="range" min="-10" max="10" step="1" value="0" aria-describedby="current-level-help"><span id="current-marker" class="current-marker" hidden aria-hidden="true"></span></div><span id="current-level-help" class="sr-only">The separate marker shows the reported current device level.</span><div class="slider-ticks" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="range-labels"><span>−10</span><span>0</span><span>+10</span></div>
<div class="details"><span id="current-detail">Currently at <strong id="current">—</strong></span><div class="unit-switch" role="group" aria-label="Temperature unit"><button id="unit-f" class="unit" aria-pressed="true">°F</button><button id="unit-c" class="unit" aria-pressed="false">°C</button></div></div>
</section>
<aside id="drawer-status" class="drawer drawer-left card live-card" aria-labelledby="live-heading"><div class="sheet-handle" aria-hidden="true"></div><div class="live-header"><h2 id="live-heading">Pod status</h2><span id="live-updated" class="live-updated">Waiting for data</span><button class="drawer-close" data-close="drawer-status" aria-label="Close Pod status">×</button></div><p class="live-note">Refreshes every 30 seconds while open</p><div id="live-status" class="hero-grid"></div><div id="live-segments" class="segment-grid"></div><details class="technical-details"><summary>Technical details</summary><div id="live-details" class="live-grid"></div></details><p id="live-error" class="live-error" role="status"></p></aside>
<aside id="drawer-session" class="drawer drawer-right card live-card" aria-labelledby="session-heading"><div class="sheet-handle" aria-hidden="true"></div><div class="live-header"><h2 id="session-heading">Session <span class="delayed">· Delayed</span></h2><span id="session-updated" class="live-updated"></span><button class="drawer-close" data-close="drawer-session" aria-label="Close session biometrics">×</button></div><p class="live-note">Readings can arrive late or change after processing.</p><div id="session-meta" class="session-meta"></div><div id="session-status" class="hero-grid"></div><div id="session-respiratory" class="session-respiratory"></div><p id="session-error" class="live-error" role="status"></p></aside>
</div>
<div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
<div id="help-overlay" class="help-overlay" hidden><section class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="help-title" aria-describedby="help-message"><div class="help-dialog-header"><h2 id="help-title"></h2><button id="help-close" class="help-close" type="button" aria-label="Close help">×</button></div><p id="help-message"></p></section></div>
<p id="message" class="message" role="status" aria-live="polite"></p></main></body></html>
