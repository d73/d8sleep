<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141c">
  <title>d8sleep</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body><main>
<header><h1>Bed temperature</h1><span id="connection" class="connection" role="status">Connecting</span></header>
<section id="control" class="card" aria-label="Bed temperature controls">
<div class="card-top"><h2 id="pod-name">Pod</h2><button id="power" class="power" aria-pressed="false">Power</button></div>
<div id="sides" class="sides" aria-label="Bed side"></div>
<div class="readout" id="target-circle"><strong id="value">—</strong><span id="estimate" class="estimate" aria-label="Estimated target temperature">—</span></div>
<label for="slider" class="sr-only">Target heating level</label><div class="slider-wrap"><input id="slider" type="range" min="-10" max="10" step="1" value="0" aria-describedby="current-level-help"><span id="current-marker" class="current-marker" hidden aria-hidden="true"></span></div><span id="current-level-help" class="sr-only">The separate marker shows the reported current device level.</span><div class="slider-ticks" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="range-labels"><span>−10</span><span>0</span><span>+10</span></div>
<div class="details"><span id="current-detail">Currently at <strong id="current">—</strong></span><div class="unit-switch" role="group" aria-label="Temperature unit"><button id="unit-f" class="unit" aria-pressed="true">°F</button><button id="unit-c" class="unit" aria-pressed="false">°C</button></div></div>
</section><p id="message" class="message" role="status" aria-live="polite"></p></main></body></html>
