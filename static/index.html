<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141c">
  <title>d8sleep</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body><main>
<header><h1>Bed temperature</h1><span id="connection" class="connection" role="status">Connecting</span></header>
<section id="control" class="card" aria-label="Bed temperature controls">
<div class="card-top"><h2>Temperature</h2><button id="power" class="power" aria-pressed="false">Power</button></div>
<div id="sides" class="sides" aria-label="Bed side"></div>
<div class="readout"><span class="readout-label">TARGET LEVEL</span><div><button id="minus" class="step" aria-label="Decrease level">−</button><strong id="value">—</strong><button id="plus" class="step" aria-label="Increase level">+</button></div><span id="estimate" class="estimate">Estimated target —</span></div>
<label for="slider" class="sr-only">Target heating level</label><input id="slider" type="range" min="-10" max="10" step="1" value="0"><div class="range-labels"><span>COOLER</span><span>WARMER</span></div>
<div class="details"><span>Current device level <strong id="current">—</strong></span><button id="units" class="unit">°F / °C</button></div>
</section><p id="message" class="message" role="status" aria-live="polite"></p></main></body></html>
